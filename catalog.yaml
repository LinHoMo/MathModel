# Modeling-Harness —— agent 元数据索引
# V3 Cognitive Workflow Runtime（15 节点 DAG + 5 角色 + 6 validator）
# 一致性由 core/tools/catalog_check.py --check 强制。
# 所有路径用正斜杠，相对于项目根目录。

schema_version: 5
runtime: agent-native

env:
  path: core/env
  config: core/env/config.yaml
  loader: core/env/loader.py
  params:
    - code
    - modeling
    - review
    - runtime

# ---- Registry 拆分（catalog/ 目录）----
# 以下三节已拆分为独立注册表文件，load_catalog() 自动合并：
#   external_skills -> catalog/external_skills.yaml
#   tools           -> catalog/protocol_tools.yaml
#   v3              -> catalog/v3.yaml
# 直接编辑对应注册表文件；本文件继续承载 schema_version / runtime / env。
