%% mcmthesis.cfg — External configuration file (inspired by thuthesis + APMCMThesis)
%% Purpose: Externalize annually-varying configuration to avoid editing the .cls main file
%% Loading mechanism: .cls end auto-loads via \IfFileExists{mcmthesis.cfg}{\input{mcmthesis.cfg}}{}
%% Users can place this file in the same directory as main.tex to override defaults;
%% deleting this file reverts to .cls built-in defaults.
%% ============================================================================

% ===== Default contest parameters (modify per team / year) =====
% Team Control Number (6-digit, assigned by contest system)
% \mcmsetup{tcn=000000}
% Problem letter (A/B/C/D/E/F)
% \mcmsetup{problem=A}

% ===== Sheet / titlepage toggles =====
% \MCM@opt@sheetfalse       % disable summary sheet
% \MCM@opt@titlepagefalse   % disable separate title page
% \MCM@opt@abstractfalse    % disable abstract block

% ===== CJK fontset (only effective when CTeX option is enabled) =====
% fontset must be set via \documentclass[CTeX,fontset=fandol]{mcmthesis}
% Options: fandol | windows | mac | ubuntu | none (default)
% Note: cannot be changed here because ctex initializes before .cfg loads.

% ===== AI Use Report toggle (2024+ mandatory) =====
% See ai_use_report.tex for the AI tools usage declaration template.

\endinput
