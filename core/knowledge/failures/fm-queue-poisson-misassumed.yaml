# 排队论泊松到达假设未验证
failure_id: fm-queue-poisson-misassumed
title: 排队论泊松到达假设未验证
problem_context: 批次性到达（如机场出租车按航班批次）硬套 M/M/c
method: 排队论
modeling_structure: queuing_theory
failure_mode: wrong-usage
symptom: 解析结果与实际等待偏差大；ρ 接近 1 时结论脆弱
root_cause: M/M/c 闭式解依赖泊松到达+指数服务假设
detection: χ²/K-S 检验到达间隔分布；分时段到达率非平稳检查
fix: 非平稳/批次到达改用分段 M(t)/M/c 或离散事件仿真
avoidance: 排队建模先做分布拟合检验，再决定解析 or 仿真
applies_to: [mc-queuing-theory]
