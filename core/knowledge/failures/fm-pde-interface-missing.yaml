# 多层介质界面条件缺失
failure_id: fm-pde-interface-missing
title: 多层介质界面条件缺失
problem_context: 复合结构（如多层服装）只给温度连续、漏热流连续
method: 数值 PDE
method_family: numerical_pde
failure_mode: wrong-method
symptom: 界面处温度/热流不连续，总能量不守恒
root_cause: 界面需同时满足温度连续+热流连续（由守恒律导出）
detection: 检查界面节点是否同时施加两类条件；总能量守恒检验
fix: 界面方程：T_left=T_right 且 k_left∂T/∂n=k_right∂T/∂n
avoidance: 多层介质建模模板固定含界面条件对
applies_to: [mc-numerical-pde]
