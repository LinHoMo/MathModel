# modeling.yaml — 建模决策 stage
# 产出: M/A artifacts + assumes/solved_by 边
# model_critique 为前置 Critic（fail 触发反馈环回 model_construction）
schema_version: 3
stage: modeling
nodes:
  model_selection:
    type: reasoning
    role: modeler
    description: 从 Method Card Registry + Decision Log 选择候选模型（Model Selection Arena）
    depends_on: [literature_search]
    outputs: [state/registry.json]
  model_construction:
    type: reasoning
    role: modeler
    description: 建立数学模型（公式/符号/边界）+ 模型依赖 DAG，产出 M artifacts
    depends_on: [model_selection]
    outputs: [state/registry.json]
  model_critique:
    type: critique
    role: critic
    validator: model-critic
    description: 模型质量前置审查（假设合理性/可解性/复杂度/与题目匹配度）
    depends_on: [model_construction]
    on_fail: model_construction
    max_retries: 2
  assumption_check:
    type: validation
    role: critic
    validator: assumption-checker
    description: 假设四维评分验证，产出 A artifacts
    depends_on: [model_critique]
  code_generation:
    type: reasoning
    role: experimenter
    description: P1-VS-001 C6: 由 MODEL_IR 生成可执行代码（固定 ABI def solve(inputs) -> outputs），产出 CODE artifacts
    depends_on: [assumption_check]
    outputs: [state/registry.json]
  model_execution:
    type: execution
    role: experimenter
    description: P1-VS-001 C7: 真 subprocess 执行可执行代码（input.json → run_model.py → output.json），产出 EXEC/R artifacts
    depends_on: [code_generation]
    outputs: [artifacts/exec/, state/registry.json]
  model_validation:
    type: validation
    role: experimenter
    description: P1-VS-001 C8: 基于真实数值验证执行结果（constraint/objective/domain），产出 VR artifacts
    depends_on: [model_execution]
    outputs: [state/registry.json]
  model_selection_decision:
    type: reasoning
    role: modeler
    description: P1-M3: 基于候选真实数值验证结果（VR 机械指标）选型，产出 decision artifact + selects 边
    depends_on: [model_validation]
    outputs: [state/registry.json]
