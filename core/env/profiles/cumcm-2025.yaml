# CUMCM（全国大学生数学建模竞赛）2025 竞赛 profile
#
# 本文件只写「国赛相对通用基线的差量」，未声明的参数全部继承 core/env/schema.yaml。
# 修改国赛参数只需改本文件（OFFICIAL 层例外，见 schema.yaml 顶部说明）。

meta:
  competition: cumcm
  name: 全国大学生数学建模竞赛
  year: 2025
  language: zh
  verified: true
  verified_date: 2026-09-04
  rules_source: https://www.cmathc.org.cn/mcm/tz/303.html
  ai_rules_source: 全国大学生数学建模竞赛人工智能工具使用规定(2025年试行)
  note: 提交前须以当届官方通知为准

inherits: _base

paper:
  max_pages: 20
  min_pages: 17
  min_words: 13000
  max_words: 16000
  min_figures: 6
  min_tables: 4
  min_equations: 15
  min_references: 10
  abstract_min_words: 400
  abstract_max_words: 600
  page_fill_ratio: 0.85
  recent_ref_ratio: 0.3

official:
  body_max_pages: 20
  appendix_pages_unlimited: true
  no_toc: true
  abstract_single_page: true
  abstract_no_english: true
  pagination_start_page: 3
  pagination_position: footer_center
  margin_cm: 2.5
  no_header: true
  electronic_format: [pdf, docx]
  electronic_max_bytes: 20971520
  electronic_no_compress: true
  electronic_no_commitment_page: true
  support_format: [zip, rar]
  support_max_bytes: 20971520
  support_must_include_source: true
  support_must_include_filelist: true
  citation_inline_required: true
  citation_style: gbt7714-numerical
  ai_disclosure_in_body: true
  ai_disclosure_in_references: true
  ai_support_pdf_name: AI工具使用详情
  ai_support_pdf_format: pdf
  ai_exclude_from_appendix: true
  anonymity_scope: [摘要页, 正文, 附录, 支撑材料]

runtime:
  language: zh
  template: cumcm-zh
  latex_engine: xelatex

template:
  dir: core/templates/latex/cumcm/
  cls: cumcmthesis.cls
  engine: xelatex
  compile_chain: [xelatex, bibtex, xelatex, xelatex]

deliverables:
  paper_name: 参赛论文
  support_name: 支撑材料
  ai_report_name: AI工具使用详情
