%% cumcmthesis.cfg — 外置配置文件 (受 thuthesis + APMCMThesis 启发)
%% 用途: 将年度变化的配置外置, 避免修改 .cls 主文件
%% 加载机制: .cls 末尾通过 \IfFileExists{cumcmthesis.cfg}{\input{cumcmthesis.cfg}}{} 自动加载
%% 用户可在 main.tex 同目录放置此文件覆盖默认值; 删除此文件则回退到 .cls 内置默认值
%% ============================================================================

% ===== 年度配置 (每年赛事更新时修改此处) =====
% \the\year 自动取当前年份, 如需固定年份请改为字面量 (如 2025)
\renewcommand*\mcm@commit@string@titlea{\the\year 高教社杯全国大学生数学建模竞赛}
\renewcommand*\mcm@numberpage@string@titlea{\the\year 高教社杯全国大学生数学建模竞赛}

