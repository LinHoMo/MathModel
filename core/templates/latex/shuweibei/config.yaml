# 数维杯大学生数学建模竞赛 竞赛包（baseline，待官方核对）
# 模板 fallback：复用国赛 cumcmthesis.cls（提交前须替换为当届官方模板）

competition: shuweibei
name: 数维杯大学生数学建模竞赛
language: zh
engine: xelatex
compile_chain: xelatex -> bibtex -> xelatex -> xelatex

template:
  cls: core/Writer/knowledge/templates/mathmodel/zh/cumcm/cumcmthesis.cls
  cfg: core/Writer/knowledge/templates/mathmodel/zh/cumcm/cumcmthesis.cfg
  main: core/Writer/knowledge/templates/mathmodel/zh/cumcm/main.tex
  fonts: [simsun.ttc, simkai.ttf]

# 注意：本竞赛包不再内置页/字数阈值。唯一真源见 core/env/profiles/<竞赛>.yaml
# （字段定义与分层语义见 core/env/schema.yaml）。阈值修改只改 profile，不要在此重复。

citation:
  style: gbt7714-numerical
  biblatex: false
  format: 顺序编码制上标 [n]
  forbid: [citep, citet]

ai_usage:
  required: true
  output: support_materials/ai_usage_disclosure.md
  note: 按当届通知提交支撑材料；若明确未使用 AI 则提交正文声明

anonymity:
  forbid_in_body: [校名, 姓名, 指导教师, 队员编号]
  note: 封面信息由官方模板单独填写

rules_verified: baseline
rules_source: 以当届官方通知为准（本包为启动基线，非官方 rubric）
