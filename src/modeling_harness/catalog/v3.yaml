# catalog/v3.yaml —— V3 视图注册表（roles/nodes/validators/workflow）
# 从 catalog.yaml 拆出；load_catalog() 合并回主视图，catalog_check 三方一致性校验消费。
v3:
  description: V3.1 认知工作流运行时（Artifact 层 + Typed Evidence Graph + Workflow DAG）
  runtime: cognitive-workflow
  workflows_dir: src/modeling_harness/workflows
  state_dir: state            # projects/<p>/state/ = registry + graph + decisions
  roles:                      # 4 角色（与 src/modeling_harness/roles/*.yaml 一致）
    - name: analyst
      path: src/modeling_harness/roles/analyst.yaml
      capabilities: 赛题结构化解析、文献检索与证据提取
    - name: modeler
      path: src/modeling_harness/roles/modeler.yaml
      capabilities: 方法选型竞技场、数学建模
    - name: experimenter
      path: src/modeling_harness/roles/experimenter.yaml
      capabilities: 实验规划、执行、证据登记
    - name: critic
      path: src/modeling_harness/roles/critic.yaml
      capabilities: 前置批判（model/experiment/evidence 三道门禁）
  nodes:                      # 16 节点（per_question 节点按 Question 展开）
    - name: problem_analysis
      role: analyst
      stage: problem-analysis
    - name: literature_search
      role: analyst
      stage: problem-analysis
    - name: model_selection
      role: modeler
      stage: modeling
    - name: model_construction
      role: modeler
      stage: modeling
    - name: model_critique
      role: critic
      validator: model-critic
      stage: modeling
    - name: assumption_check
      role: critic
      validator: assumption-checker
      stage: modeling
    - name: code_generation
      role: experimenter
      stage: modeling
    - name: model_execution
      role: experimenter
      stage: modeling
    - name: model_validation
      role: experimenter
      stage: modeling
    - name: model_selection_decision
      role: modeler
      stage: modeling
    - name: experiment_design
      role: experimenter
      stage: experiment
    - name: experiment
      role: experimenter
      per_question: true
      stage: experiment
    - name: experiment_critique
      role: critic
      validator: experiment-critic
      per_question: true
      stage: experiment
    - name: evidence_build
      role: experimenter
      stage: evidence
    - name: evidence_gate
      role: critic
      validator: evidence-gate
      stage: evidence
    - name: quality_evaluation
      role: critic
      validator: research-quality
      stage: evidence
  validators:                 # 4 validator（DAG validator 绑定）
    - name: evidence-gate
      kind: runtime
      path: src/modeling_harness/validators/evidence/evidence_gate.py
    - name: research-quality
      kind: runtime
      path: src/modeling_harness/validators/quality/
    - name: model-critic
      kind: skill
      path: src/modeling_harness/skills/critics/model-critic/SKILL.md
    - name: experiment-critic
      kind: skill
      path: src/modeling_harness/skills/critics/experiment-critic/SKILL.md
    - name: assumption-checker
      kind: runtime
      path: src/modeling_harness/validators/modules/assumption_validator.py
