# Modeling-Harness 参数唯一真源（schema）
#
# 分层语义：
#   OFFICIAL  官方硬约束 —— 来自竞赛组委会规范条文，违反可能取消评奖资格。
#                          profile 可声明但不可放宽；用户 override 覆盖即报错。
#   DERIVED   派生值     —— 由 OFFICIAL 推算而来（如字数 = 页数 x 每页字数）。
#                          可微调，但改动会被一致性验算检查。
#   TUNABLE   经验软目标 —— 无官方规定，来自获奖论文统计。用户可自由调整。
#
# 合并优先级（后者覆盖前者，但 OFFICIAL 在 profile 层之后锁定）：
#   schema.yaml 的 value  <  profiles/<竞赛>.yaml  <  config.yaml 的 overrides
#
# 每个参数字段：
#   value    默认值
#   layer    OFFICIAL / DERIVED / TUNABLE
#   type     int / float / bool / str / list
#   range    [min, max]（数值型可选）
#   source   依据出处（官方条文编号 或 经验值说明）

schema_version: 3


# ---------------------------------------------------------------------------
# 官方硬约束（国赛 2025 规范 + AI 工具使用规定 2025 试行）
# 来源：https://www.cmathc.org.cn/mcm/tz/303.html
# ---------------------------------------------------------------------------
code:
  random_seed:
    value: 42
    layer: TUNABLE
    type: int
    source: 经验值：固定种子保证可复现
  multi_run_count:
    value: 5
    layer: TUNABLE
    type: int
    range: [1, 50]
    source: 经验值：启发式算法多次运行次数
  cv_threshold:
    value: 0.10
    layer: TUNABLE
    type: float
    range: [0.0, 1.0]
    source: 经验值：交叉验证稳定性阈值
  solver_timeout_small:
    value: 300
    layer: TUNABLE
    type: int
    source: 经验值：求解器超时（<100变量，秒）
  solver_timeout_medium:
    value: 600
    layer: TUNABLE
    type: int
    source: 经验值：求解器超时（100-1000变量，秒）
  solver_timeout_large:
    value: 1200
    layer: TUNABLE
    type: int
    source: 经验值：求解器超时（>1000变量，秒）
  max_fix_rounds:
    value: 3
    layer: TUNABLE
    type: int
    range: [1, 10]
    source: 经验值：单子问题自检修复轮数上限
  sensitivity_range:
    value: 0.20
    layer: TUNABLE
    type: float
    range: [0.01, 1.0]
    source: 经验值：灵敏度扰动范围
  sensitivity_steps:
    value: 10
    layer: TUNABLE
    type: int
    range: [3, 50]
    source: 经验值：灵敏度扫描步数
  min_main_py_bytes:
    value: 500
    layer: TUNABLE
    type: int
    source: 经验值：main.py 最少字节
  target_platform:
    value: python
    layer: TUNABLE
    type: str
    source: 主线代码平台：python（V3 执行层 local_python）

# ---------------------------------------------------------------------------
# 建模规格
# ---------------------------------------------------------------------------
modeling:
  min_candidate_models:
    value: 2
    layer: TUNABLE
    type: int
    range: [1, 10]
    source: 铁律 M1：候选模型至少2个
  assumption_score_threshold:
    value: 6.0
    layer: TUNABLE
    type: float
    range: [0.0, 10.0]
    source: 经验值：假设四维评分通过阈值
  ambiguity_min_interpretations:
    value: 2
    layer: TUNABLE
    type: int
    range: [1, 5]
    source: 经验值：歧义至少两种解释并验算裁决
  multi_start_check:
    value: true
    layer: TUNABLE
    type: bool
    source: 经验值：非凸/启发式必做多起点稳定性检查
  literature_search_enabled:
    value: true
    layer: TUNABLE
    type: bool
    source: 文献检索总开关
  literature_max_searches:
    value: 5
    layer: TUNABLE
    type: int
    source: 经验值：最大检索次数
  literature_target_count:
    value: 7
    layer: TUNABLE
    type: int
    source: 经验值：目标入选文献数
  literature_score_threshold:
    value: 6.0
    layer: TUNABLE
    type: float
    source: 经验值：入选最低评分
  literature_chinese_ratio:
    value: 0.5
    layer: TUNABLE
    type: float
    source: 经验值：中文文献最低占比
  dag_enable_visualization:
    value: true
    layer: TUNABLE
    type: bool
    source: 是否生成 DAG 的 SVG 可视化
  problem_modeling_round:
    value: 1
    layer: TUNABLE
    type: int
    range: [1, 3]
    source: 建模推导迭代轮次
  problem_analysis_round:
    value: 1
    layer: TUNABLE
    type: int
    range: [1, 3]
    source: 问题分析迭代轮次

# ---------------------------------------------------------------------------
# 评审规格
# ---------------------------------------------------------------------------
review:
  max_rounds:
    value: 4
    layer: TUNABLE
    type: int
    range: [1, 10]
    source: 经验值：评审最大轮数
  improvement_max_rounds:
    value: 2
    layer: TUNABLE
    type: int
    range: [1, 10]
    source: 经验值：论文改进最大轮数
  pass_score:
    value: 6
    layer: TUNABLE
    type: int
    range: [0, 10]
    source: 经验值：评审通过分（满分10）
  figure_as_subject_max:
    value: 3
    layer: TUNABLE
    type: int
    range: [0, 20]
    source: 经验值：图表做主语句式最大次数

# ---------------------------------------------------------------------------
# 运行时
# ---------------------------------------------------------------------------
runtime:
  language:
    value: zh
    layer: TUNABLE
    type: str
    source: 语言 zh/en
  strict_mode:
    value: true
    layer: TUNABLE
    type: bool
    source: 严格模式：阈值不达则退回修正
  traceability_min_ratio:
    value: 0.90
    layer: TUNABLE
    type: float
    range: [0.0, 1.0]
    source: 经验值：数值可追溯比例下限
  numeric_tolerance_rel:
    value: 0.005
    layer: TUNABLE
    type: float
    source: 数值相对容差上限
  numeric_tolerance_abs:
    value: 0.01
    layer: TUNABLE
    type: float
    source: 数值绝对容差上限
  profile:
    value: standard
    layer: TUNABLE
    type: str
    source: 能力分层：standard / lite

# ---------------------------------------------------------------------------
# 断点与沙箱
# ---------------------------------------------------------------------------
checkpoint:
  enabled:
    value: false
    layer: TUNABLE
    type: bool
    source: 是否启用 checkpoint
  path:
    value: output/checkpoint.json
    layer: TUNABLE
    type: str
    source: checkpoint 文件路径
  save_interval:
    value: 1
    layer: TUNABLE
    type: int
    source: 每完成 N 个 agent 保存一次

cloud_sandbox:
  enabled:
    value: false
    layer: TUNABLE
    type: bool
    source: 是否启用云端执行
  provider:
    value: e2b
    layer: TUNABLE
    type: str
    source: 云端提供商：e2b / daytona / local
  fallback:
    value: local
    layer: TUNABLE
    type: str
    source: 云端不可用时回退策略

# ---------------------------------------------------------------------------
# 交付物命名
# ---------------------------------------------------------------------------
