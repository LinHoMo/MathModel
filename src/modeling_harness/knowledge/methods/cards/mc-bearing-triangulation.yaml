# 测向交会定位几何 — 楔形交集/直径圆/最优基线建模知识卡
# 定位：Model Construction Knowledge（约束/先验/验证），不是算法说明书。
# 核心机理：区间误差（非分布）⇒ 角域楔形 ⇒ 凸集交 ⇒ 直径/最小包围圆是两种不同的不确定性度量。
card_id: mc-bearing-triangulation
name: 测向交会定位几何（楔形交集与定位区域度量）
family: computational_geometry
version: 2
problem_types: [bearing_localization, wedge_intersection, geometric_inference]
good_for:
  - 多站测向（DF）交会定位：给定观测点坐标与示向度，求目标可能区域（2026_B 问题 1）
  - 误差为区间界（±ε）而非概率分布时的确定性定位区域刻画
  - 需要判断「用直径作圆能否覆盖不确定区域」的覆盖类问题
  - 观测点布站优化：只考虑几何精度衰减因子（GDOP）的第二站选址
structure_signals:
  - 题面给出「示向度误差全局在 [−ε, +ε] 内」一类的区间界表述
  - 同时给出多个观测点坐标与各自测得的方位角
  - 问项要求「定位区域的直径」「能否被某圆覆盖」等区域度量
  - 问项要求「下一个测点放哪里能定位更好」——典型 GDOP 问题
problem_structures: [localization, geometric_gauge, convex_region]
modeling_patterns: [distance, half_plane_intersection, error_propagation]
mathematical_forms: [linear_algebra, optimization, statistics]
mechanism:
  - 区间误差 → 楔形角域：每条示向度带 ±ε 张角，是一条射线被加宽为角度扇形（等价两条半平面）
  - 凸集交封闭：若干楔形（凸）的交仍是凸多边形，顶点数随站点数增加但有界
  - 直径 ≠ 覆盖半径：凸集直径是最大顶点对距离；最小包围圆半径可大于直径之半（钝角/锐角三角形）
  - Thales 判据：P 在以 AB 为直径的圆内 ⟺ ∠APB ≥ 90°，给出「直径圆覆盖」的充要条件
  - 精度闭式三项缺一不可：D = (2 sinε / sinχ)·√(R² + L² + |R² + L² − d²|)，R=|S₁G|、L=|S₂G|、χ 为源端交会角、d=|S₁S₂|
  - 只取 1/sinχ（即 GDOP）是不完整的：√ 因子随 L 单调增长。在 χ≡90° 的垂线族上闭式退化为 D = 2ε·√(R²+t²)，随偏移 t 严格递增——故「φ=90° 最优」不成立（实测 t=300→43.27 m，t=1200→59.50 m）
  - 决策变量是 S₁ 处的转角 ψ 与前进距离 d，不是交会角 χ；χ 是 (ψ, d, R) 的因变量，不可直接当作可控量
  - 源距不可观测时须对 R 取期望：min E[D]，并同时报告最坏直径 F 与第二次测量失效概率，三者并列才能定 d
  - 区间型题给参数三档语义：「参数落在 [a, b]」通常是「真值未知、已知落在 [a,b]」而非「量被限制在 [a,b] 内」。硬约束只能取保证端——例如有效接收半径 r_rec ∈ [1000,1500] m 意味着 |S−G| ≤ 1000 m 保证可行、1000 < |S−G| ≤ 1500 m 条件可行、> 1500 m 恒不可行；把 1000 m 当「太近收不到」的下界是方向读反
  - 可行性优先于最优性：候选布站若以一定概率整体失效，必须先按失效率阈值切出可行集 F，再在 F 内比较 E[D]；否则条件期望会让「多数时候收不到信号」的方案凭少数成功样本胜出（实测 108 点网格中 81 点最大失效率超 2%）
formulations:
  - "楔形：W_i = {P : arg(P−S_i) ∈ [b_i−ε, b_i+ε]}，半平面形式 a·x ≤ c"
  - 定位区域：Ω = ∩_i W_i（Sutherland–Hodgman 逐半平面裁剪）
  - 直径：D_Ω = max_{(p,q)∈Ω×Ω} |p−q|（凸包顶点枚举或旋转卡壳）
  - 覆盖判据：Ω ⊆ C(A,B) ⟺ ∠APB ≥ 90°，∀P ∈ vert(Ω)\{A,B}
  - 精度（完整）：D(ψ, d; R, δ₁, δ₂) 由精确半平面交给出；闭式仅作解析代理，须声明适用域并做域外对照
  - 精度（代理，禁用为唯一判据）：σ_P ∝ 1/sin φ；P₂* = G_est + t·n⊥，n⊥ ⊥ (G_est − S₁)
solvers:
  - 半平面裁剪（Sutherland–Hodgman）+ 凸包 + O(h²) 最远点对
  - 最小包围圆：Welzl 随机增量（期望 O(n)）
  - 交会解算：两条射线求交的 2×2 线性系统，判退化（行列式近零 / t < 0）
  - 第二点搜索：在 (ψ, d) 网格上用精确半平面交数值求 E[D]；解析垂线只用于解释趋势，不得直接用于选点
requires:
  - 误差为区间界而非分布（若是分布，应改用置信椭圆而非楔形交集）
  - 观测点坐标与示向度可配对；站点数 ≥ 2
  - 各站误差独立同界（相关性未建模时须在局限中声明）
  - 定位区域非空（楔形确实相交）；空交集须作为「不可定位」如实报告
risks:
  - 用解析代理代替精确半平面交而不声明适用域，域外偏差可达 100%（域内可低至 0.6%）
  - 以 GDOP / 交会角为唯一选点判据，漏掉 L 对误差的放大，选出的点可比真最优差 37%（源距已知）至 7 倍（源距未知）
  - 钝角交会时两条射线几何发散，楔形扩大产生巨大甚至无界区域，「有效」误判
  - 以「直径圆」代替最小包围圆，得到偏小的不确定度
  - 近共线布站（φ→0°）使 GDOP 爆炸，却被当作定位成功
  - 射线求交未判 t ≥ 0，出现「背向解」落在源的反侧
  - 对误差做过强假设（正态 + 独立），但题面只给了区间界
validation:
  - 退化检测：构造近共线/钝角算例，检查区域是否发散并如实标注
  - 反例构造：给出一个锐角三角形使「直径圆覆盖」不成立，证明该判据不是恒真
  - 代理准则对拍：若用 GDOP / 交会角等代理准则选点，必须与真目标 E[D] 对拍并报告最大相对偏差与适用域；「解析与网格两路一致」若两路同一准则则属同义反复，不构成最优性证据
  - 可计算性：闭式的自变量必须是决策时可算出的虚拟源 G'（两条测得示向度射线的交点），用真实源参数代入会造成数量级误差
  - 失效模式分离：定位区域为空/无界 与 区域存在但判据失败 必须分开记账，混报会虚增失败率
  - 先验灵敏度：最优 (ψ, d) 随源距先验漂移（实测面积均匀→30°、r 均匀→40°、远距→20°），须报候选区与灵敏度表，不报单点最优角
  - 覆盖性核查：若声称覆盖，须逐顶点验证张角 ≥ 90°（不抽样、不外推）
  - 交会角单调性：沿推荐线偏移时定位区域直径随偏移单调变化
  - 可行性优先：先按 max P_fail ≤ τ 切出可行集，再在可行集内比较目标；报告可行集规模 |F| / |候选集| 与被剔除点的最大失效率
  - 区间参数三档判定：对每个区间型题给参数声明「可观测 / 不可先知」，不可先知者其硬约束取保证端，演示算例一律取保证可行档
  - 双准则交叉核验：用至少两个不同的最优性判据（如最小最大后悔值 与 绝对极小极大）各选一次，报告两者是否一致；一致才报单点建议
often_combined_with: [mc-coverage-search, mc-monte-carlo, mc-closed-form-validity-domain, mc-prior-robustness-regret, mc-conclusion-attribution, mc-failure-mode-separation]
anti_patterns:
  - 把区间误差当正态分布，直接给 3σ 椭圆
  - 宣称「直径圆总能覆盖定位区域」而不给判据与反例
  - 站点近共线仍输出一个看似精确的点估计
  - 只报区域直径、不报最小包围圆，掩盖钝角情形的不确定度
  - 用 GDOP ∝ 1/sinφ 或「交会角越接近 90° 越好」直接选点，未与真目标 E[D] 对拍
  - 把源距、接收半径等不可观测量当已知量代入决策（如用信号强度反推的 d_est 定位）
  - 反例用手写几何常量代替由正向模型生成的实例，夸大失效程度
  - 用「解析与网格两路一致」冒充最优性证明
  - 把题面「某参数落在 [a, b]」读成双向约束，用乐观端当保证端
  - 在混有大量高失效率方案的候选集上直接比较条件期望
