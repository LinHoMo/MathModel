failure_id: fm-synthetic-counterexample
title: 反例用手写几何常量构造，夸大失效程度
problem_context: 为证明某判据不是恒真（如「以直径为直径的圆总能覆盖凸集」）而构造反例
method: 手写几何常量构造反例
modeling_structure: general
failure_mode: overclaim
symptom: 用手工给定的三角形顶点作反例，其 ρ = r_MEC/D 达 0.5083，而该构型族的实际可达上确界只有 0.5002942（ρ 是相似不变量，只依赖源端交会角 χ 与距离比 r₂/r₁；2000×40 密集扫描定值，argmax 在 χ=90.035°、r₂/r₁=1.061），夸大失效程度约 28.3 倍；真实结论只是需要把圆放大到 1.000588 D，而非手搓反例给出的 1.0167 D
root_cause: 手搓常量不满足正向模型约束（未由观测方程生成），落在真实可达集之外，因而放大了失效幅度
detection: 反例必须由正向模型生成——给定真源与站点坐标，按观测方程产出带误差的示向度，再反解出定位区域；凡是字面写死的几何常量一律标记为合成反例
detection_signal: 反例以顶点坐标列表形式直接出现在代码或文档常量中，而非由 (真源, 站点, 误差界) 生成；或反例的 ρ 超出同族构型的实测上确界（如两站测向交会的 0.5002942）
fix: 改为正向模型生成反例；用相似不变量降维（ρ 只依赖 χ 与距离比，与绝对尺度无关）后做定向密集扫描定出上确界，并同时报告「实测失效幅度」与「同类上确界」两个数
avoidance: 反例构造函数只接受 (真源, 站点, 误差界) 作为入参，不接受顶点坐标；输出同时给出「实测失效幅度」与「同类上确界」两个数
recovery:
  - 用正向模型重新生成反例并重算失效幅度
  - 在结论中把「最坏可能」与「实际可达」分开陈述
applies_to: [mc-bearing-triangulation]
source: 2026_B 无线电干扰源定位清除（问题 1）对抗性复算
severity: medium
