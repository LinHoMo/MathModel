failure_id: fm-proxy-objective-unvalidated
title: 用代理准则（GDOP / 交会角）代替真目标选点且未做对拍
problem_context: 需要选定第二个观测点或布站方案的几何优化问题，直接用「交会角越接近 90° 越好」或 GDOP ∝ 1/sinφ 作为选点判据
method: 测向交会定位几何（GDOP / 交会角代理准则）
modeling_structure: bearing_localization
failure_mode: wrong-usage
symptom: 声称「交会角 90° 最优」并给出垂线族上的单点建议；与真目标 E[D] 数值对拍后偏差可达 7 倍——源距未知时推荐点 E[D] = 432.7 m 而真最优 59.4 m，第二次测量失效概率由 0.15% 升到 33.4%
root_cause: 精度闭式 D = (2 sinε / sinχ)·√(R² + L² + |R² + L² − d²|) 含两个因子，代理准则只保留 1/sinχ，丢掉了随 L 单调增长的 √ 因子；且在 χ ≡ 90° 的垂线族上闭式退化为 D = 2ε·√(R² + t²)，随偏移 t 严格递增（实测 t=300 → 43.27 m，t=1200 → 59.50 m），与「90° 最优」直接矛盾。此外 χ 是 (ψ, d, R) 的因变量，不是可控量
detection: 在同一 (ψ, d) 网格上用精确半平面交数值求真目标 E[D]，与代理准则选出的点对比，报告最大相对偏差与适用域。注意「解析式与网格搜索两路一致」若两路使用同一代理准则则属同义反复，不构成对拍证据
detection_signal: 结论只给出单一最优角而不给候选区；或验证章节宣称「两路一致」但两路共用同一目标函数
fix: 目标改为 min E[D]，并同时并列报告最坏直径 F 与第二次测量失效概率，三者共同定 d。若必须保留代理准则，须在报告中标注其与真目标偏差的上界及适用域
avoidance: 代理准则只允许用于缩小候选区，最终选点一律回到真目标的数值解；选点结论报候选区 + 灵敏度表，不报单点最优角
recovery:
  - 把代理准则降格为候选区生成器，真目标数值解做终选
  - 在报告中补一条「代理准则 vs 真目标」最大相对偏差的量化陈述
applies_to: [mc-bearing-triangulation]
source: 2026_B 无线电干扰源定位清除（问题 1/2）对抗性复算
severity: high
version: 1
status: active
