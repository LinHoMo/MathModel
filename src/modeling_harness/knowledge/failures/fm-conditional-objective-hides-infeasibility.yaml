failure_id: fm-conditional-objective-hides-infeasibility
title: 在含大量不可行方案的候选集上比较「条件期望」，选出多数时候用不了的方案
problem_context: 决策变量会使方案以一定概率整体失效（收不到信号 / 超时 / 越界），却用「成功条件下的目标期望」做排序
method: 任意带失效概率的期望目标优化
modeling_structure: optimization
failure_mode: wrong-usage
symptom: 条件期望 E[D | 成功] 只统计成功的样本，失败样本被静默丢弃。于是一个 60% 概率收不到信号的方案，只凭剩下 40% 样本里的漂亮数字就能排到最优。2026_B Q2 的 (ψ,d) 网格共 108 点，其中 81 点最大失效率超过 2%（最高 100%），若不先筛除就会主导比较结果
root_cause: 目标函数定义时把「失效」当成缺省可忽略的情形，而非必须计价或必须剔除的硬约束；失效概率没有进入目标，也没有进入可行性判定
detection: 对每个候选方案显式计算失效概率 P_fail（对全部不确定参数取最大值而非均值），先按阈值筛出可行集 F = { x : max_π P_fail(x,π) ≤ τ }，再在 F 内部比较目标；报告 |F| / |候选集| 以及被剔除点的最大失效率
detection_signal: 报告中只出现条件期望而没有任何失效概率列；或候选集里出现了目标值异常小、但物理上根本拿不到观测的方案
fix: 两选一——(a) 可行性优先：按失效率阈值筛出可行集，只在可行集内比较目标，并在报告中同时列出 E[D]、最坏直径与失效概率；(b) 把失效计入目标（如 E[D] + λ·P_fail 或惩罚项），使失效不再免费
avoidance: 只要目标里出现「条件于成功」的期望，就必须在同一张表里并列该方案的失效概率；最优性比较永远在可行集内进行，可行性判定先于最优性判定。本条与 fm-infeasible-scenario 互补——后者是「演示算例本身不可行」，本条是「可行与不可行方案混在一起比目标」，检测时须先区分二者再选补救路径
recovery:
  - 重算全部候选点的失效概率，按阈值切出可行集后重做排序
  - 若可行集为空，说明网格/参数域设错，先修参数域而不是放宽阈值
  - 在结论中显式给出可行集规模，让读者判断该建议的实际适用范围
applies_to: [mc-prior-robustness-regret, mc-bearing-triangulation]
source: 2026_B 无线电干扰源定位清除（问题 2）第二检测点选择
severity: high
version: 1
status: active
