failure_id: fm-interval-parameter-direction
title: 把题面「参数落在 [a, b]」的区间语义读反，用乐观端当保证端
problem_context: 题面以区间形式给出某个不可先知的参数（接收半径、误差界、速度、效率等），需要据此设定硬约束
method: 任意含区间型题给参数的约束建模
modeling_structure: general
failure_mode: wrong-usage
symptom: 2026_B 题面「有效接收半径 1000–1500 m」被当成「距离必须 ≥1000 m 且 ≤1500 m」的双向约束，于是 950 m 的算例被判为不可行、而 1200 m 的算例被当作可行。实际语义是 r_rec 为未知参数、取值落在 [1000, 1500]：|S−G| ≤ 1000 m 时无论 r_rec 取何值都必然可接收（保证可行），1000 m < |S−G| ≤ 1500 m 只在 r_rec 偏大时才成立（条件可行），> 1500 m 恒不可行
root_cause: 区间 [a,b] 有两种完全不同的语义——「量本身被限制在 [a,b] 内」与「量的真值未知、已知落在 [a,b] 内」——未加区分就套用双向不等式。对后者，硬约束只能取保证端（离差侧），乐观端不构成约束
detection: 逐一列出题面所有区间型参数，对每个回答两个问题：(1) 该量是决策者可观测/可控，还是不可先知的未知参数？(2) 若是未知参数，硬约束必须取其保证端，并明确写出「保证可行 / 条件可行 / 不可行」三档判定
detection_signal: 约束写成双向不等式 a ≤ x ≤ b 而 x 与某个未知参数单调相关；或算例恰好卡在端点上、稍作扰动就翻转结论
fix: 把约束改写为三档：保证可行（对未知参数整个区间都成立）、条件可行（仅当未知参数偏于某侧时成立）、不可行。演示算例与关键结论一律取保证可行档；若只能用条件可行档，必须显式声明结论依赖该未知参数的取值
avoidance: 引入未知参数时先声明其可观测性；凡「不可先知」者，其区间只用于取保证端约束与做敏感性分析，不得直接代入某个具体值（代入具体值等于隐藏假设）
recovery:
  - 列出区间参数的语义判定表（可观测 / 不可先知）
  - 把硬约束换成保证端，重算可行性
  - 对仍在条件档的算例，补做未知参数两端的敏感性分析或降级为「仅算法演示」
applies_to: [mc-bearing-triangulation, mc-prior-robustness-regret]
source: 2026_B 无线电干扰源定位清除（问题 1/2）有效接收半径语义复算
severity: high
version: 1
status: active
