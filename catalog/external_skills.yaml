# catalog/external_skills.yaml —— 从 catalog.yaml 拆出的外部 Skill 注册表
# 由 load_catalog() 合并回主视图；单独编辑本文件即可增删外部 Skill。
# 外部 skill 集成
external_skills:
  # PDF 解析 skill
  - name: pdf-parser
    type: python
    description: "解析 PDF 文件，提取文本、表格、图片"
    install: "pip install pdfplumber"
    fallback: "使用 PyPDF2 内置解析"

  # 代码执行 skill
  - name: code-executor
    type: python
    description: "安全执行 Python 代码"
    install: "无需额外安装（使用内置 subprocess）"
    fallback: "静态分析代码，不实际执行"

  # MWORKS Syslab（国产 MATLAB 兼容，M/Julia 双运行时）执行 skill
  - name: syslab
    type: system
    description: "MWORKS Syslab 环境（M 命令行 mlang + Julia julia-ty），用于 MATLAB/北太天元交付分支的真实执行"
    install: "安装 MWORKS Syslab；skills 位于 core/skills/syslab/；SYSLAB_HOME 写入 ~/.syslab/syslab-env.ini"
    fallback: "仅产出 .m 文件不执行，标注'未实际执行'"
