key_constraints:
  - 螺线方程约束（龙头沿等距螺线运动）
  - 把手间距约束（相邻节间距守恒 = 板长相关）
  - 龙头匀速约束（v0 = 1 m/s）
  - 不碰撞约束（任意两节间距 ≥ 板宽/安全距离）
  - 调头空间约束（Q3: 盘入到半径4.5m边界）
  - 相切约束（Q4: S形曲线与盘入盘出螺线均相切）
  - 速度上限约束（Q5: 各把手速度 ≤ 2 m/s）
  - 单位一致性约束（题面cm与m/s需换算）

evaluation_targets:
  - 坐标精度（Q1/Q2/Q4 位置结果与金标准的误差）
  - 碰撞时间精度（Q2 终止时刻）
  - 螺距最小化（Q3 最小螺距的正确性）
  - 速度合理性（Q5 最大速度的推导与数值）
  - 刚体约束守恒（相邻节间距误差 < 1e-6）
  - 数值收敛性（时间步长减半后结果变化 < 0.1%）

known_failure_modes:
  - FM-PA-001  # wrong_abstraction（运动学误判为评价类，P15.1 B0 实锤）
  - FM-MC-001  # wrong_mechanism（用TOPSIS等评价方法解运动学）
  - FM-MS-001  # wrong_model_family（评价族 vs 几何运动族）
  - FM-MS-002  # method_name_trap（TOPSIS数学正确但问题错配）
  - FM-FC-003  # unit_inconsistency（cm与m混用）
  - FM-FC-004  # index_inconsistency（节索引/时间步长口径）
  - FM-VA-001  # missing_validation
  - FM-ME-003  # empty_artifact_passing（P15.1 Q001空壳）
  # CUMCM-Bench 旧标签: FM-PA-02, FM-MC-03, FM-FC-03, FM-VA-01

known_invalid_model_patterns:
  - pattern: "使用TOPSIS/AHP/PCA等评价方法处理运动学问题"
    why_invalid: "评价方法输出排名/权重，无法产生时空坐标和速度；方法假设（独立指标）与运动学的时空耦合矛盾。P15.1 B0 实锤：method_selection=0%。"
  - pattern: "忽略板凳长度差异（龙头341cm vs 龙身220cm）"
    why_invalid: "龙头比龙身长121cm，忽略此差异导致把手间距计算错误，影响碰撞检测精度。"
  - pattern: "将螺距55cm直接当作半径或直径"
    why_invalid: "螺距是相邻圈的径向距离，不是半径；混淆导致螺旋线参数化完全错误。"
  - pattern: "碰撞检测只检查相邻节"
    why_invalid: "螺旋盘入时非相邻节（如第1节与第50节）可能碰撞，必须检查所有 |i-j|>1 的节对。"
  - pattern: "Q5 直接假设所有把手速度=龙头速度"
    why_invalid: "龙尾在螺旋内侧/外侧时速度可能远超龙头速度（角速度相同但半径不同），必须逐节计算。"

forbidden_misinterpretations:
  - "将'顺时针盘入'理解为'逆时针'（方向错误导致坐标符号全反）"
  - "将'螺距55cm'理解为'螺旋半径55cm'或'直径55cm'"
  - "将'第16圈A点'理解为'半径16m处'"
  - "忽略'龙头前把手'与'龙尾后把手'的区别（结果模板中有特定列）"
  - "将Q3的'最小螺距'理解为'最大螺距'（优化方向错误）"
  - "将Q5的'各把手速度不超过2m/s'理解为'龙头速度不超过2m/s'"

validation_expectations:
  - 刚体约束验证：逐帧检查相邻节间距守恒，相对误差 < 1e-6
  - 网格收敛验证：时间步长减半（dt=0.01→0.005）后关键节点位置变化 < 0.1%
  - 对称性验证：盘入/盘出对称参数下轨迹对称，误差 < 1%
  - 速度有界验证：龙头匀速条件下各节速率不超过 2*v0（物理合理性）
  - 碰撞检测验证：已知碰撞时刻的人工抽检
  - 单位一致性验证：所有输入参数统一为 m 和 s

common_human_errors:
  - 混淆螺距与半径
  - 忽略龙头与龙身的长度差异
  - 碰撞检测遗漏非相邻节
  - Q4 S形曲线的相切条件计算错误
  - 单位换算遗漏（cm→m）
  - 时间步长选择不当导致数值耗散

common_llm_errors:
  - 被'评价''优化'等关键词误导，选择TOPSIS/AHP等评价方法（P15.1实锤）
  - 子问题分解失败（5问压成1个空壳，P15.1 Q001）
  - 生成的代码中N=223但循环范围错误（off-by-one）
  - 螺旋线方程参数化错误（角度与半径的关系搞反）
  - 碰撞检测复杂度O(N²)但未优化导致超时
  - 论文中数值与代码结果不一致（missing provenance）

