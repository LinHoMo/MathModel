family:
  - kinematics  # 运动学
  - geometric_modeling  # 几何建模
  - optimization  # 优化（Q3/Q4）
  # CUMCM-Bench 标签: 几何运动 / 综合

sub_questions:
  - id: Q1
    desc: "舞龙队沿螺距为55cm的等距螺线顺时针盘入，龙头前把手速度1m/s，初始位于第16圈A点。给出从初始时刻到300s为止，每秒整个舞龙队的位置和速度，保存到result1.xlsx。论文中给出0/60/120/180/240/300s时特定节的位置和速度。"
    type: forward_simulation  # 正向运动学仿真
    required_deliverables:
      - result1.xlsx（每秒全节位置速度，6位小数）
      - 论文表1（6个时刻7个特定节的位置）
      - 论文表2（6个时刻7个特定节的速度）
    depends_on: []

  - id: Q2
    desc: "沿Q1设定的螺线盘入，确定盘入终止时刻使得板凳之间不发生碰撞，给出此时舞龙队的位置和速度，保存到result2.xlsx。"
    type: collision_detection  # 碰撞检测
    required_deliverables:
      - result2.xlsx（终止时刻全节位置速度）
      - 论文中特定节的位置和速度
    depends_on: [Q1]

  - id: Q3
    desc: "调头空间为以螺线中心为圆心、直径9m的圆形区域。确定最小螺距，使得龙头前把手能够沿着相应的螺线盘入到调头空间的边界。"
    type: parameter_optimization  # 参数优化（最小螺距）
    required_deliverables:
      - 最小螺距数值
      - 推导过程
    depends_on: [Q1]

  - id: Q4
    desc: "盘入螺距1.7m，盘出螺线与盘入关于中心对称，调头路径由两段圆弧相切连接成S形（前弧半径=后弧2倍），与盘入盘出均相切。能否调整圆弧使调头曲线变短？给出从-100s到100s每秒的位置和速度，保存到result4.xlsx。"
    type: trajectory_optimization  # 轨迹优化
    required_deliverables:
      - 优化后的调头曲线参数
      - result4.xlsx（-100s到100s每秒位置速度）
      - 论文中-100/-50/0/50/100s特定节的位置和速度
    depends_on: [Q2, Q3]

  - id: Q5
    desc: "沿Q4设定的路径行进，龙头速度保持不变，确定龙头的最大行进速度，使得舞龙队各把手的速度均不超过2m/s。"
    type: velocity_optimization  # 速度约束优化
    required_deliverables:
      - 龙头最大速度数值
      - 各把手速度分析
    depends_on: [Q4]

allowed_model_families:
  - multibody_dynamics  # 多体动力学/刚体链递推
  - catenary_approximation  # 悬链线近似（Q2初估）
  - differential_geometry  # 微分几何（螺旋线参数化）
  - numerical_optimization  # 数值优化（Q3/Q4/Q5）
  - pure_geometric_spiral  # 纯几何螺旋拟合（Q2/Q4辅助）

acceptable_solution_variants:
  - desc: "多体递推（刚体链）+ 螺旋几何解析"
    conditions:
      - 每节板凳视为刚体，相邻间距守恒
      - 龙头沿阿基米德螺线运动
      - 后节位置由前节约束递推
      - 适用 Q1/Q2/Q3
    playbook_reference: playbook-2024A-bench-dragon.md §4.3
  - desc: "有限元柔性体"
    conditions:
      - 考虑板凳弯曲变形
      - 精度最高但计算量大
      - 竞赛不推荐
    playbook_reference: playbook-2024A-bench-dragon.md §3（推荐度 ★☆☆☆☆）

