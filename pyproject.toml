[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mathmodel-skills"
version = "1.0.0"
description = "Scientific/Mathematical Modeling Harness - V3 Cognitive Workflow (Artifact Registry + Evidence Graph + Research State)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "e2e: 端到端测试（依赖归档样例或完整交付产物，可条件跳过但必须分类）",
    "integration: 集成测试（依赖交付实例/外部内容条件的测试，分类登记见 catalog 双视图）",
    "requires_runtime: 依赖外部运行时（MMBench 语料 / 云端沙箱等）",
]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
