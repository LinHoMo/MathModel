<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathModelSkills 架构图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
  h1 { font-size: 28px; font-weight: 600; color: #58a6ff; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 40px; }
  .diagram { position: relative; width: 1100px; height: 700px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .node rect { rx: 8; ry: 8; stroke-width: 2; cursor: pointer; transition: filter 0.2s; }
  .node:hover rect { filter: brightness(1.2); }
  .node text { font-size: 13px; font-weight: 600; fill: #fff; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .node .card { font-size: 11px; font-weight: 400; fill: #c9d1d9; text-anchor: middle; }
  .edge { stroke: #30363d; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  .edge.dashed { stroke-dasharray: 5,5; }
  .edge-label { font-size: 11px; fill: #8b949e; text-anchor: middle; }
  .legend { display: flex; gap: 24px; margin-top: 20px; font-size: 12px; color: #8b949e; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-color { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #30363d; }
</style>
</head>
<body>
<h1>MathModelSkills 架构图</h1>
<p class="subtitle">基于 UTG 六层防御的数学建模四手协作系统 · 29 个 agent · 3 层门禁</p>

<div class="diagram">
<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#58a6ff"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>

  <!-- Edges: main flow -->
  <path d="M 170 280 L 290 200" class="edge" marker-end="url(#arrowhead)"/>
  <path d="M 430 260 L 490 360" class="edge" marker-end="url(#arrowhead)"/>
  <path d="M 630 400 L 690 260" class="edge" marker-end="url(#arrowhead)"/>
  <path d="M 830 200 L 960 360" class="edge" marker-end="url(#arrowhead)"/>

  <!-- Edges: dashed connections -->
  <path d="M 350 280 L 350 540" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 560 440 L 600 540" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 770 240 L 900 540" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 130 540 L 280 280" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 130 200 L 280 180" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 600 120 L 350 540" class="edge dashed" marker-end="url(#arrowgray)"/>
  <path d="M 600 120 L 600 540" class="edge dashed" marker-end="url(#arrowgray)"/>

  <!-- Edge labels -->
  <text x="220" y="230" class="edge-label">赛题文件</text>
  <text x="440" y="300" class="edge-label">MODEL_SPEC.md</text>
  <text x="650" y="320" class="edge-label">CODE_DELIVERABLES.md</text>
  <text x="900" y="270" class="edge-label">PAPER_SPEC.md</text>
  <text x="300" y="420" class="edge-label" transform="rotate(-90,300,420)">推进状态</text>
  <text x="565" y="480" class="edge-label" transform="rotate(-90,565,480)">门禁检查</text>
  <text x="850" y="420" class="edge-label" transform="rotate(-90,850,420)">最终验证</text>
  <text x="180" y="420" class="edge-label" transform="rotate(-90,180,420)">参数注入</text>
  <text x="200" y="180" class="edge-label">方法匹配</text>

  <!-- Nodes: Input -->
  <g class="node" transform="translate(60,240)">
    <rect width="120" height="80" fill="#238636" stroke="#2ea043"/>
    <text x="60" y="30">赛题输入</text>
    <text x="60" y="55" class="card">赛题文件</text>
  </g>

  <!-- Nodes: Modeler -->
  <g class="node" transform="translate(290,160)">
    <rect width="140" height="80" fill="#1f6feb" stroke="#58a6ff"/>
    <text x="70" y="28">Modeler 手</text>
    <text x="70" y="52" class="card">8 agent</text>
  </g>

  <!-- Nodes: Programmer -->
  <g class="node" transform="translate(490,360)">
    <rect width="140" height="80" fill="#1f6feb" stroke="#58a6ff"/>
    <text x="70" y="28">Programmer 手</text>
    <text x="70" y="52" class="card">6 agent</text>
  </g>

  <!-- Nodes: Writer -->
  <g class="node" transform="translate(690,160)">
    <rect width="140" height="80" fill="#1f6feb" stroke="#58a6ff"/>
    <text x="70" y="28">Writer 手</text>
    <text x="70" y="52" class="card">7 agent</text>
  </g>

  <!-- Nodes: Reviewer -->
  <g class="node" transform="translate(890,360)">
    <rect width="140" height="80" fill="#8957e5" stroke="#a371f7"/>
    <text x="70" y="28">Reviewer 手</text>
    <text x="70" y="52" class="card">8 agent</text>
  </g>

  <!-- Nodes: Output -->
  <g class="node" transform="translate(960,360)">
    <rect width="120" height="80" fill="#238636" stroke="#2ea043"/>
    <text x="60" y="28">论文输出</text>
    <text x="60" y="52" class="card">main.tex/pdf</text>
  </g>

  <!-- Nodes: State -->
  <g class="node" transform="translate(290,540)">
    <rect width="120" height="60" fill="#0d1117" stroke="#f0883e"/>
    <text x="60" y="22">状态机</text>
    <text x="60" y="42" class="card">STATE.md</text>
  </g>

  <!-- Nodes: Gate -->
  <g class="node" transform="translate(540,540)">
    <rect width="120" height="60" fill="#0d1117" stroke="#f85149"/>
    <text x="60" y="22">门禁系统</text>
    <text x="60" y="42" class="card">gate.py</text>
  </g>

  <!-- Nodes: Validate -->
  <g class="node" transform="translate(840,540)">
    <rect width="120" height="60" fill="#0d1117" stroke="#f0883e"/>
    <text x="60" y="22">验证器</text>
    <text x="60" y="42" class="card">validate.py</text>
  </g>

  <!-- Nodes: Config -->
  <g class="node" transform="translate(60,540)">
    <rect width="120" height="60" fill="#161b22" stroke="#484f58" stroke-dasharray="4"/>
    <text x="60" y="22">env 配置</text>
    <text x="60" y="42" class="card">config.yaml</text>
  </g>

  <!-- Nodes: Knowledge -->
  <g class="node" transform="translate(60,160)">
    <rect width="120" height="60" fill="#161b22" stroke="#484f58" stroke-dasharray="4"/>
    <text x="60" y="22">知识库</text>
    <text x="60" y="42" class="card">50+ 方法论</text>
  </g>

  <!-- Nodes: Orchestrator -->
  <g class="node" transform="translate(520,80)">
    <rect width="160" height="60" fill="#238636" stroke="#2ea043"/>
    <text x="80" y="22">编排器</text>
    <text x="80" y="42" class="card">orchestrator.py</text>
  </g>
</svg>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#1f6feb"></div>核心手（Modeler/Programmer/Writer）</div>
  <div class="legend-item"><div class="legend-color" style="background:#8957e5"></div>评审手（Reviewer）</div>
  <div class="legend-item"><div class="legend-color" style="background:#238636"></div>输入/输出/编排</div>
  <div class="legend-item"><div class="legend-color" style="background:#0d1117;border-color:#f85149"></div>门禁/状态/验证</div>
  <div class="legend-item"><div class="legend-color" style="background:#161b22;border-style:dashed"></div>配置/知识库</div>
</div>

<script>
document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', () => {
    const card = node.querySelector('.card');
    if (card) {
      const text = card.textContent;
      alert(text);
    }
  });
});
</script>
</body>
</html>
